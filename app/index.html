<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="color-scheme" content="dark"/>
    <title>Isle of Man Weather Forecast</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Red+Hat+Display:wght@400..800&display=swap" rel="stylesheet">

    <!-- Primary stylesheet -->
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<header class="site-header">
    <h1>Isle of Man Weather</h1>
    <div id="ask-container"></div>
    <div class="date-filter">
        <label class="visually-hidden" for="forecast-date">Pick a date</label>
        <input type="date" id="forecast-date"/>
        <button type="button" id="reset-filter">Latest</button>
    </div>
</header>

<main>
    <div id="loading" class="status" role="status">
        <div class="spinner"></div>
        <p>Loading forecast data...</p>
    </div>
    <div id="error-message" class="status status-error" role="alert"></div>
    <div id="no-data-message" class="status" role="status"></div>

    <div id="forecast-container">
        <div class="stage" id="stage">
            <canvas id="scene" aria-hidden="true"></canvas>
            <div class="stage-hint">Drag to move through time</div>
            <div class="hud">
                <div class="hud-when" id="when"></div>
                <div class="hud-what" id="what"></div>
            </div>
            <div class="stage-controls">
                <button type="button" id="play">Play</button>
                <button type="button" id="now">Now</button>
            </div>
        </div>
        <div class="strip" id="strip" role="slider" tabindex="0" aria-label="Time" aria-valuemin="0"></div>
        <nav class="chips" id="chips" aria-label="Day"></nav>
        <div class="days" id="days"></div>
    </div>
</main>

<footer>
    <p>
        Data provided by the
        <a href="https://www.gov.im/weather/5-day-forecast/" target="_blank" rel="noopener"
        >Isle of Man Meteorological Service</a
        >.
    </p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
